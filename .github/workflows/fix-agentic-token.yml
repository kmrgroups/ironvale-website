name: Fix Agentic AI token
on:
  push:
    paths:
      - '.agentic-token-fix-enable'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Agentic Control Tower auth/loading
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('agentic-ai-v2/ui/control-tower.js')
          s=p.read_text()
          old="var token=function(){return sessionStorage.getItem('idms_token')||'';};"
          new="var token=function(){try{return (window.Core&&window.Core.getToken?window.Core.getToken():'')||sessionStorage.getItem('app_token')||'';}catch(e){return '';}};"
          if old not in s:
              raise SystemExit('token pattern not found')
          s=s.replace(old,new,1)
          old2="""  function boot(){\n    var tries=0, timer=setInterval(function(){\n      tries++;\n      if(!document.querySelector('[data-panel=\\\"agentic_ai\\\"]')){if(tries>120)clearInterval(timer);return;}\n      if(token()){clearInterval(timer);mount();return;}\n      if(tries>120)clearInterval(timer);\n    },500);\n    document.addEventListener('click',function(e){\n      var t=e.target&&e.target.closest&&e.target.closest('[data-screen=\\\"agentic_ai\\\"]');\n      if(t) setTimeout(function(){mount();},0);\n    });\n  }"""
          if old2 not in s:
              raise SystemExit('boot pattern not found')
          new2="""  function boot(){\n    var tries=0, timer=setInterval(function(){\n      tries++;\n      var panel=document.querySelector('[data-panel=\\\"agentic_ai\\\"]');\n      if(panel){\n        clearInterval(timer);\n        mount();\n        if(token()) refresh().catch(function(e){var st=document.getElementById('aa-v2-status');if(st)st.textContent=e.message;});\n        return;\n      }\n      if(tries>240)clearInterval(timer);\n    },250);\n    document.addEventListener('click',function(e){\n      var t=e.target&&e.target.closest&&e.target.closest('[data-screen=\\\"agentic_ai\\\"]');\n      if(t) setTimeout(function(){mount();if(token())refresh().catch(function(){});},0);\n    });\n  }"""
          s=s.replace(old2,new2,1)
          p.write_text(s)

          kp=Path('kpi.js')
          k=kp.read_text()
          k=k.replace("import('/agentic-ai-v2/ui/control-tower.js')","import('/agentic-ai-v2/ui/control-tower.js?v=20260915')")
          kp.write_text(k)
          PY
      - name: Commit fix
        run: |
          git config user.name 'openai-agent'
          git config user.email 'openai-agent@users.noreply.github.com'
          git add agentic-ai-v2/ui/control-tower.js kpi.js
          git commit -m 'Fix Agentic Control Tower authentication and cache loading'
          git push
