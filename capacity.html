  model.machines.forEach((m, i) => {
    const n = i + 3;
    cp.push([{ v: m.code, s: ST.bold }, { v: m.availDays, s: ST.inputDec }, { f: `SUMIF('Capacity-workout'!$D$2:$D$${lastW},A${n},'Capacity-workout'!$K$2:$K$${lastW})`, v: m.reqDays, s: ST.dec },
      { f: `B${n}-C${n}`, v: m.balDays, s: ST.dec }, { f: `IF(D${n}>0,"No Load","Overload")`, v: m.excelStatus, s: ST.text }, { f: `IF(B${n}=0,0,C${n}/B${n})`, v: m.util / 100, s: ST.pct }, { v: TIER[m.tier].label, s: ST.text }, { v: m.remarks, s: ST.text }]);
  });
  const lastC = model.machines.length + 2;
  cp.push([{ v: 'Grand Total', s: ST.totalText }, { f: `SUM(B3:B${lastC})`, v: model.totals.avail, s: ST.totalDec }, { f: `SUM(C3:C${lastC})`, v: model.totals.req, s: ST.totalDec }, { f: `SUM(D3:D${lastC})`, v: model.totals.bal, s: ST.totalDec }, { v: '', s: ST.totalText }, { f: `IF(B${lastC + 1}=0,0,C${lastC + 1}/B${lastC + 1})`, v: model.totals.util / 100, s: ST.pct }, { v: '', s: ST.totalText }, { v: '', s: ST.totalText }]);
  cp.push(null, [{ v: 'Column C uses SUMIF on the Capacity-workout sheet, so it recalculates instantly (no pivot refresh needed). Yellow cells are inputs.', s: ST.sub }]);
  const plan = { name: 'Capacity Plan', cols: [22, 14, 16, 14, 14, 11, 18, 34], rows: cp, freeze: 'A3', heights: { 1: 32 }, tabSelected: true,
    cf: [{ ref: `E3:E${lastC}`, rules: [{ text: 'Overload', dxf: 0 }, { text: 'No Load', dxf: 1 }] }, { ref: `G3:G${lastC}`, rules: [{ text: 'Overload', dxf: 0 }, { text: 'Sunday', dxf: 2 }, { text: 'Within', dxf: 1 }] }] };
  // Schedule sheet
  const sr = [[{ v: 'Machine', s: ST.head }, { v: 'Part #', s: ST.head }, { v: 'Part Name', s: ST.head }, { v: 'Process', s: ST.head }, { v: 'Qty', s: ST.head }, { v: 'Due Date', s: ST.head }, { v: 'Run Days', s: ST.head }, { v: 'Start', s: ST.head }, { v: 'Finish', s: ST.head }, { v: 'Takt (s)', s: ST.head }, { v: 'Effective CT (s)', s: ST.head }, { v: 'Status', s: ST.head }]];
  model.machines.forEach(m => m.ops.filter(r => r.qty > 0).sort((a, b) => a.start - b.start).forEach(r => sr.push([{ v: m.code, s: ST.bold }, { v: r.partNo, s: ST.text }, { v: r.partName, s: ST.text }, { v: r.process, s: ST.text }, { v: r.qty, s: ST.int }, { v: r.due, s: ST.text }, { v: r.reqDays, s: ST.dec }, { v: r.startDate || '', s: ST.text }, { v: r.endDate || 'Beyond month', s: ST.text }, { v: r.taktSec, s: ST.dec }, { v: r.effCT, s: ST.dec }, { v: r.overflow ? 'Beyond month' : r.late ? 'After due date' : 'On time', s: ST.text }])));
  const sched = { name: 'Loading Schedule', cols: [20, 12, 32, 20, 10, 12, 10, 12, 13, 10, 13, 15], rows: sr, freeze: 'A2', heights: { 0: 30 }, cf: [{ ref: `L2:L${sr.length}`, rules: [{ text: 'Beyond', dxf: 0 }, { text: 'After', dxf: 2 }, { text: 'On time', dxf: 1 }] }] };
  const bytes = XLSX.write({ title: `Capacity Plan ${per}`, author: s.companyName, sheets: [plan, work, sched, set] });
  download(`${safeName(s.companyName)}_Capacity_Plan_${state.year}-${E.pad(state.month + 1)}.xlsx`, new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  toast('Excel workbook downloaded');
}

/* ---------- Print report ---------- */
function printReport() {
  const prev = ui.page;
  const t = model.totals;
  const area = $('#printArea');
  const ms = model.machines;
  area.innerHTML = `
    <section class="kpis"><div class="kpi"><span class="lbl">Plant utilisation</span><span class="val">${fmt(t.util, 1)}%</span><span class="foot">${fmt(t.req)} of ${fmt(t.avail, 0)} machine-days</span></div>
    <div class="kpi"><span class="lbl">Over capacity</span><span class="val">${(t.counts.critical || 0) + (t.counts.sunday || 0)} / ${ms.length}</span><span class="foot">machines</span></div>
    <div class="kpi"><span class="lbl">Late operations</span><span class="val">${t.lateOps} / ${t.activeOps}</span><span class="foot">vs customer due dates</span></div>
    <div class="kpi"><span class="lbl">Volume</span><span class="val">${fmtInt(t.qtyParts)}</span><span class="foot">pcs · ${fmtInt(t.reqHours)} machine-hours</span></div></section>
    <h2 style="margin:14px 0 6px">Capacity Plan</h2>
    <table class="tbl"><thead><tr><th>Machine</th><th class="r">Available</th><th class="r">Required</th><th class="r">Balance</th><th class="r">Utilisation</th><th>Status</th><th>Remarks</th></tr></thead><tbody>
    ${ms.map(m => `<tr><td><b>${h(m.code)}</b></td><td class="r num">${fmt(m.availDays, 1)}</td><td class="r num">${fmt(m.reqDays)}</td><td class="r num ${m.balDays < 0 ? 'neg' : ''}">${signed(m.balDays)}</td><td class="r num">${fmt(m.util, 1)}%</td><td>${pill(m.tier)}</td><td>${h(m.remarks)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td class="r num">${fmt(t.avail, 1)}</td><td class="r num">${fmt(t.req)}</td><td class="r num">${signed(t.bal)}</td><td class="r num">${fmt(t.util, 1)}%</td><td colspan="2"></td></tr></tfoot></table>
    <h2 style="margin:16px 0 6px;break-before:page">Machine Loading Schedule</h2>
    <table class="tbl"><thead><tr><th>Machine</th><th>Part</th><th>Process</th><th class="r">Qty</th><th class="r">Due</th><th class="r">Days</th><th class="r">Start</th><th class="r">Finish</th><th>Status</th></tr></thead><tbody>
    ${ms.flatMap(m => m.ops.filter(r => r.qty > 0).sort((a, b) => a.start - b.start)).map(r => `<tr><td>${h(r.machine)}</td><td>${h(r.partNo)} · ${h(r.partName)}</td><td>${h(r.process)}</td><td class="r num">${fmtInt(r.qty)}</td><td class="r num">${fmtDate(r.due)}</td><td class="r num">${fmt(r.reqDays)}</td><td class="r num">${fmtDate(r.startDate)}</td><td class="r num">${r.endDate ? fmtDate(r.endDate) : '—'}</td><td>${r.overflow ? 'Beyond month' : r.late ? 'After due date' : 'On time'}</td></tr>`).join('')}</tbody></table>
    <p class="small muted" style="margin-top:10px">Powered by KMR Group of Companies · www.kmr-groups.com</p>`;
  $('#printHead').querySelector('div').lastElementChild.textContent = `Capacity & Loading Report · ${E.MONTHS[state.month]} ${state.year} · ${scenarioLabel()}`;
  document.body.classList.add('print-report');
  const done = () => { document.body.classList.remove('print-report'); area.innerHTML = ''; window.removeEventListener('afterprint', done); ui.page = prev; };
  window.addEventListener('afterprint', done);
  setTimeout(() => { window.print(); setTimeout(() => { if (document.body.classList.contains('print-report') && !matchMedia('print').matches) done(); }, 1500); }, 60);
}

/* ---------- boot ---------- */
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(() => { if (window.PageAfter[ui.page]) window.PageAfter[ui.page](); }, 150); });
window.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('cell-inp') && ev.target.tagName === 'INPUT') { ev.target.blur(); } });

(function boot() {
  applyTheme();
  state = loadLocal();
  const brand = LS.get('cp4_brand'); if (brand && !LS.get(K_STATE)) Object.assign(state.settings, brand);
  const u = LS.get(K_UI); if (u && u.page && PAGES.some(p => p.id === u.page)) ui.page = u.page;
  const hash = (location.hash || '').replace('#', ''); if (PAGES.some(p => p.id === hash)) ui.page = hash;
  render();
  cloudBoot();
})();

</script>
</body>
