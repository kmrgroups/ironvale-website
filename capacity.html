<!DOCTYPE html>
<html lang="en">

<title>Capacity Planner</title>
<meta name="description" content="Manufacturing capacity plan, takt time and machine loading system">
<meta name="theme-color" content="#0E2240">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="capacity.webmanifest">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230E2240'/%3E%3Cpath d='M14 48V30M26 48V18M38 48V36M50 48V24' stroke='%23C9A96E' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* ==========================================================================
   Capacity Planner — "Navy & Brass" corporate theme
   ========================================================================== */
:root {
  --ink: #0E2240;          /* navy — sidebar, headings */
  --ink-2: #16305A;
  --brass: #A8844A;        /* accent */
  --brass-soft: #F4ECDD;
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface-2: #F8F9FB;
  --line: #DDE2EA;
  --line-strong: #C5CDD9;
  --text: #16202E;
  --muted: #5B6778;
  --faint: #8A95A5;
  --focus: #2F5EA8;
  --ok: #1F7A55;   --ok-bg: #E3F4EC;
  --tight: #6A6F1E; --tight-bg: #F1F3D9;
  --warn: #9A6200; --warn-bg: #FFF1D1;
  --crit: #B42318; --crit-bg: #FDE7E5;
  --idle: #6B7686; --idle-bg: #EEF1F5;
  --bar-track: #E9EDF2;
  --shadow: 0 1px 2px rgba(14,34,64,.05), 0 4px 16px rgba(14,34,64,.05);
  --nav-bg: #0E2240; --nav-text: #C9D3E3; --nav-active: #FFFFFF; --nav-hover: rgba(255,255,255,.07);
  --radius: 10px;
  --serif: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #D9E2F1; --ink-2: #B9C7DD; --brass: #D1AE72; --brass-soft: #2E2718;
    --bg: #0B1321; --surface: #111C2E; --surface-2: #0F192A; --line: #22324A; --line-strong: #2F4260;
    --text: #E4E9F1; --muted: #9AA7BA; --faint: #6F7D92; --focus: #7FA6E6;
    --ok: #5CC795; --ok-bg: #12301F; --tight: #C9CF6A; --tight-bg: #2B2D12; --warn: #F0B54A; --warn-bg: #33260B;
    --crit: #FF8A7E; --crit-bg: #3A1512; --idle: #93A0B3; --idle-bg: #1A2638; --bar-track: #1C2A40;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --nav-bg: #08101C; --nav-text: #A9B6CA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #D9E2F1; --ink-2: #B9C7DD; --brass: #D1AE72; --brass-soft: #2E2718;
  --bg: #0B1321; --surface: #111C2E; --surface-2: #0F192A; --line: #22324A; --line-strong: #2F4260;
  --text: #E4E9F1; --muted: #9AA7BA; --faint: #6F7D92; --focus: #7FA6E6;
  --ok: #5CC795; --ok-bg: #12301F; --tight: #C9CF6A; --tight-bg: #2B2D12; --warn: #F0B54A; --warn-bg: #33260B;
  --crit: #FF8A7E; --crit-bg: #3A1512; --idle: #93A0B3; --idle-bg: #1A2638; --bar-track: #1C2A40;
  --shadow: 0 1px 2px rgba(0,0,0,.3); --nav-bg: #08101C; --nav-text: #A9B6CA;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--serif); color: var(--ink); text-wrap: balance; margin: 0; font-weight: 600; letter-spacing: -.005em; }
h1 { font-size: 1.55rem; line-height: 1.2; }
h2 { font-size: 1.15rem; line-height: 1.3; }
h3 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--focus); }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--brass); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100%; }
.side { background: var(--nav-bg); color: var(--nav-text); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; overflow-y: auto; }
.brand { display: flex; gap: 12px; align-items: center; padding: 20px 18px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
.logo { width: 40px; height: 40px; border-radius: 8px; flex: none; display: grid; place-items: center; background: #fff; color: #0E2240; font: 700 15px/1 var(--serif); overflow: hidden; border: 1px solid rgba(168,132,74,.6); }
.logo img { width: 100%; height: 100%; object-fit: contain; }
.brand-name { color: #fff; font: 600 14px/1.25 var(--serif); }
.brand-sub { font-size: 11px; color: #9FB0C8; margin-top: 2px; }
.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-group { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #7E8FA9; padding: 14px 10px 6px; }
.nav button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 7px; cursor: pointer; font-size: 13.5px; color: var(--nav-text); position: relative; }
.nav button:hover { background: var(--nav-hover); color: #fff; }
.nav button.active { background: rgba(255,255,255,.1); color: var(--nav-active); font-weight: 600; }
.nav button.active::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--brass); }
.nav button:focus-visible { outline: 2px solid var(--brass); }
.nav svg { width: 18px; height: 18px; flex: none; opacity: .9; }
.nav .badge { margin-left: auto; font: 600 10.5px/1 var(--mono); padding: 3px 6px; border-radius: 10px; background: #B42318; color: #fff; }
.side-foot { padding: 14px 18px 18px; border-top: 1px solid rgba(255,255,255,.08); font-size: 11px; color: #7E8FA9; }
.side-foot a { color: #C9A96E; text-decoration: none; }
.sync-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #C9D3E3; margin-bottom: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #6B7686; display: inline-block; }
.dot.on { background: #3CC486; } .dot.busy { background: #F0B54A; } .dot.err { background: #FF6B5E; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 12px 28px; }
.page-title { flex: 1 1 260px; min-width: 0; }
.page-title h1 { font-size: 1.35rem; }
.page-title p { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.content { padding: 22px 28px 40px; display: flex; flex-direction: column; gap: 20px; max-width: 1480px; width: 100%; }

/* ---------- Controls ---------- */
.btn { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 7px; font: 500 13px/1 var(--sans); cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.primary:hover { background: var(--ink-2); }
.btn.brass { background: var(--brass); border-color: var(--brass); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, var(--line)); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { all: unset; box-sizing: border-box; padding: 0 12px; height: 32px; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; color: var(--muted); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ink); color: var(--surface); font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.period { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); height: 34px; }
.period button { all: unset; cursor: pointer; width: 30px; height: 32px; display: grid; place-items: center; color: var(--muted); }
.period button:hover { color: var(--text); }
.period select { border: 0; background: transparent; font: 600 13px var(--sans); color: var(--text); padding: 0 2px; height: 32px; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
.inp { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); }
textarea.inp { height: auto; padding: 8px 10px; min-height: 120px; font: 12px/1.45 var(--mono); }
.inp:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
.inp.num { text-align: right; }
.cell-inp { width: 100%; min-width: 64px; height: 30px; padding: 0 8px; border: 1px solid transparent; border-radius: 6px; background: var(--brass-soft); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.cell-inp.txt { font-family: var(--sans); background: transparent; border-color: var(--line); }
.cell-inp:hover { border-color: var(--line-strong); }
.cell-inp:focus { outline: none; border-color: var(--focus); background: var(--surface); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field .hint { font-size: 11.5px; color: var(--faint); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px 16px; }
.chk { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; cursor: pointer; }
.chk input { margin-top: 3px; accent-color: var(--ink); }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 16px 20px 12px; }
.card-h .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.card-b { padding: 4px 20px 20px; }
.card-b.flush { padding: 0 0 6px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; }
.grid-2e { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.kpi { padding: 16px 20px 18px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi:last-child { border-right: 0; }
.kpi .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.kpi .val { font: 600 1.9rem/1.05 var(--serif); color: var(--ink); font-variant-numeric: tabular-nums lining-nums; }
.kpi .val small { font: 500 .8rem var(--sans); color: var(--muted); margin-left: 4px; }
.kpi .foot { font-size: 12px; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--bar-track); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 3px; }
.tiers { display: flex; gap: 6px; flex-wrap: wrap; }

/* Status pills */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.tight { color: var(--tight); background: var(--tight-bg); }
.pill.sunday { color: var(--warn); background: var(--warn-bg); }
.pill.critical { color: var(--crit); background: var(--crit-bg); }
.pill.idle { color: var(--idle); background: var(--idle-bg); }
.pill.plain::before { display: none; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 11px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.brass { background: var(--brass-soft); border-color: transparent; color: var(--brass); }

/* ---------- Tables ---------- */
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.tbl th { position: sticky; top: 0; z-index: 1; text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--surface-2); padding: 9px 12px; border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; }
.tbl .c { text-align: center; }
.tbl td.num, .tbl th.r { font-variant-numeric: tabular-nums; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr.click:hover td { background: var(--surface-2); }
.tbl tbody tr.sel td { background: color-mix(in srgb, var(--brass) 9%, var(--surface)); }
.tbl tfoot td { font-weight: 600; background: var(--surface-2); border-top: 1px solid var(--line-strong); border-bottom: 0; }
.tbl .stick { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.tbl th.stick { z-index: 2; background: var(--surface-2); }
.tbl .neg { color: var(--crit); font-weight: 600; }
.tbl .pos { color: var(--ok); }
.tbl .zero td { color: var(--faint); }
.xl { font: 600 10px var(--mono); color: var(--brass); letter-spacing: 0; text-transform: none; display: block; margin-top: 2px; }

/* Load bar in table */
.lbar { position: relative; height: 10px; border-radius: 5px; background: var(--bar-track); min-width: 90px; }
.lbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
.lbar .cap { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.fill-ok { background: var(--ok); } .fill-tight { background: var(--tight); } .fill-sunday { background: var(--warn); } .fill-critical { background: var(--crit); } .fill-idle { background: var(--idle); }

/* Machine load chart (SVG) */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--sans); }
.chart .lab { fill: var(--text); font-weight: 500; }
.chart .val { fill: var(--text); font: 600 11px var(--mono); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .capline { stroke: var(--ink); stroke-width: 2; }
.chart .sunline { stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart .track { fill: var(--bar-track); }
.chart .b-ok { fill: var(--ok); } .chart .b-tight { fill: var(--tight); } .chart .b-sunday { fill: var(--warn); } .chart .b-critical { fill: var(--crit); } .chart .b-idle { fill: var(--idle); }
.chart .row-hit { fill: transparent; cursor: pointer; }
.chart .row-hit:hover { fill: color-mix(in srgb, var(--brass) 10%, transparent); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 8px; border-radius: 2px; display: inline-block; }
.legend i.line { width: 2px; height: 12px; background: var(--ink); }
.legend i.dash { width: 12px; height: 0; border-top: 2px dashed var(--warn); border-radius: 0; }

/* Cells */
.cells { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.cellbox { all: unset; box-sizing: border-box; cursor: pointer; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); display: flex; flex-direction: column; gap: 7px; }
.cellbox:hover { border-color: var(--line-strong); }
.cellbox.on { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); background: var(--surface); }
.cellbox:focus-visible { outline: 2px solid var(--focus); }
.cellbox .t { display: flex; justify-content: space-between; font-weight: 600; font-size: 13px; }
.cellbox .s { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }

/* Action list */
.actions-list { display: flex; flex-direction: column; }
.act { display: grid; grid-template-columns: 4px 1fr; gap: 14px; padding: 13px 20px; border-top: 1px solid var(--line); }
.act:first-child { border-top: 0; }
.act .stripe { border-radius: 2px; }
.act h4 { margin: 0 0 3px; font: 600 13.5px var(--sans); color: var(--text); }
.act p { font-size: 12.5px; color: var(--muted); }
.act .go { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }

/* Inspector */
.insp-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
.insp-metrics div { background: var(--surface-2); padding: 9px 10px; }
.insp-metrics b { display: block; font: 600 15px var(--mono); color: var(--ink); }
.insp-metrics span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.oplist { display: flex; flex-direction: column; gap: 8px; max-height: 460px; overflow-y: auto; }
.opcard { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; }
.opcard.zero { opacity: .55; }
.opcard .l1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.opcard .l2 { color: var(--muted); margin-top: 2px; }
.opcard .l3 { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--line); font: 11.5px var(--mono); color: var(--muted); }

/* ---------- Gantt ---------- */
.gantt { min-width: 900px; font-size: 12px; }
.g-head, .g-row { display: grid; grid-template-columns: 170px 1fr; }
.g-days { display: grid; }
.g-day { text-align: center; font: 10.5px var(--mono); color: var(--muted); padding: 6px 0 5px; border-left: 1px solid var(--line); }
.g-day.off { background: repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--line) 70%, transparent) 4px 5px); color: var(--faint); }
.g-day.hol { background: var(--crit-bg); color: var(--crit); }
.g-day .w { display: block; font-size: 9px; font-family: var(--sans); text-transform: uppercase; }
.g-head { position: sticky; top: 0; background: var(--surface-2); border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); z-index: 2; }
.g-name { padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; border-right: 1px solid var(--line); position: sticky; left: 0; background: var(--surface); z-index: 1; }
.g-head .g-name { background: var(--surface-2); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.g-name b { font-weight: 600; font-size: 12.5px; }
.g-name span { font: 11px var(--mono); color: var(--muted); }
.g-row { border-bottom: 1px solid var(--line); }
.g-lane { position: relative; min-height: 44px; }
.g-bg { position: absolute; inset: 0; display: grid; }
.g-bg i { border-left: 1px solid var(--line); }
.g-bg i.off { background: repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--line) 55%, transparent) 4px 5px); }
.g-bg i.hol { background: var(--crit-bg); }

// Converts the earlier v3 JSON (Client_Delivery_Package_KMR) to this format
function convertV3(d) {
  const clean = x => String(x || '').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();

    settings: Object.assign(clone(window.SEED_DATA.settings), { companyName: b.companyName || 'Company', subtitle: b.subtitle || '', logo: b.logo || '', oee: b.oee || 80, hoursPerDay: b.hoursPerDay || 22, daysPerMonth: b.daysPerMonth || 25 }),
    machines: (d.machines || []).map(x => ({ code: x.machine, cell: E.cellOf(x.machine), availDays: null, hoursPerDay: null, remarks: '', active: true })),
    operations: (d.operations || []).map(o => ({ id: o.id, partNo: clean(o.partNo), partName: clean(o.partName), process: clean(o.process), machine: o.machine, cycleTime: Number(o.cycleTime) || 0, alternates: [] })),

  const machines = {};
  (d.machines || []).forEach(x => machines[x.machine] = { availDays: x.availDays, remarks: x.remarks || '' });

function timeAgo(ts) {

}

function actNeeds(act) { return ADMIN_ACTS.includes(act) ? 'admin' : EDITOR_ACTS.includes(act) ? 'editor' : null; }
function fieldNeeds(el) {
  const d = el.dataset;
  if (d.qty || d.due || d.avail || d.remark || d.mfield || d.ofield) return 'editor';
  if (d.setting) return EDITOR_SETTINGS.includes(d.setting) ? 'editor' : 'admin';
  if (d.settingBool) return EDITOR_SETTINGS.includes(d.settingBool) ? 'editor' : 'admin';
  if (d.weekoff !== undefined || el.id === 'hDate' || el.id === 'hName') return 'admin';

function applyPermissions() {

    const need = el.dataset.act ? actNeeds(el.dataset.act) : fieldNeeds(el);

/* ---------- favicon from the logo in Settings ---------- */
const DEFAULT_ICON = document.querySelector('link[rel="icon"]') ? document.querySelector('link[rel="icon"]').href : '';
let faviconFor = null;
function setIconLink(rel, href, sizes) {
  let l = document.querySelector(`link[rel="${rel}"]`);
  if (!l) { l = document.createElement('link'); l.rel = rel; document.head.appendChild(l); }
  if (sizes) l.sizes = sizes;
  l.href = href;
}
function applyFavicon(logo) {
  if (faviconFor === (logo || '')) return;          // only redraw when the logo changes
  faviconFor = logo || '';
  if (!logo) { setIconLink('icon', DEFAULT_ICON); setIconLink('apple-touch-icon', DEFAULT_ICON); return; }
  const img = new Image();
  img.onload = () => {
    // Square, padded versions so wide logos stay readable in the browser tab and on home screens
    const draw = (size, pad, bg) => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d');
      if (bg) { x.fillStyle = bg; x.fillRect(0, 0, size, size); }
      const box = size - pad * 2, sc = Math.min(box / img.width, box / img.height);
      const w = img.width * sc, h = img.height * sc;
      x.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      return c.toDataURL('image/png');
    };
    try {
      setIconLink('icon', draw(64, 2, null), '64x64');
      setIconLink('apple-touch-icon', draw(180, 18, '#FFFFFF'), '180x180');
    } catch (e) { setIconLink('icon', logo); }
  };
  img.onerror = () => setIconLink('icon', DEFAULT_ICON);
  img.src = logo;
}

function cellSummary() {
  const cells = [...new Set(model.machines.map(m => m.cell))];
  return cells.map(c => {
    const ms = model.machines.filter(m => m.cell === c);
    const av = ms.reduce((a, m) => a + m.availDays, 0), rq = ms.reduce((a, m) => a + m.reqDays, 0), u = av ? rq / av * 100 : 0;
    const worst = ms.some(m => m.tier === 'critical') ? 'critical' : ms.some(m => m.tier === 'sunday') ? 'sunday' : u >= state.settings.warnPct ? 'tight' : 'ok';
    return `<button class="cellbox ${ui.cellFilter === c ? 'on' : ''}" data-cell="${h(c)}"><span class="t"><span>${h(c)}</span><span class="num">${fmt(u, 0)}%</span></span>

  }).join('');
}

function attentionList() {
  const items = [];
  const sun = model.sundaysAvailable;
  model.machines.filter(m => m.tier === 'critical').sort((a, b) => a.balDays - b.balDays).forEach(m => {
    const short = m.reqDays - (m.availDays + (state.scenario === 'sunday' ? 0 : sun));
    items.push({ k: 'crit', t: `${m.code} is overloaded by ${fmt(-m.balDays)} days (${fmtInt(m.overloadHours)} h)`,
      p: state.scenario === 'sunday' ? `Even with Sundays it needs ${fmt(-m.balDays)} more days. Move or split work to another machine.` : `Working all ${sun} Sundays still leaves it ${fmt(short)} days short. Move or split work to another machine.`,
      b: [['Open Load Balancer', 'nav:balance'], ['View machine', 'mach:' + m.code]] });
  });
  model.machines.filter(m => m.tier === 'sunday').forEach(m => {
    items.push({ k: 'warn', t: `${m.code} needs ${fmt(-m.balDays)} extra days`, p: `Cover with ${Math.ceil(-m.balDays - 1e-9)} Sunday${Math.ceil(-m.balDays) > 1 ? 's' : ''} of ${sun} available, or move ${fmtInt(m.overloadHours)} h of work.`, b: [['View machine', 'mach:' + m.code]] });
  });
  const takt = model.rows.filter(r => r.qty > 0 && !r.meetsTakt);
  takt.slice(0, 3).forEach(r => {
    const need = Math.ceil(r.effCT / r.taktSec);
    items.push({ k: 'warn', t: `${r.partNo} ${r.process} cannot reach takt on ${r.machine}`, p: `Needs ${fmt(r.effCT, 0)} s/pc at ${state.settings.oee}% OEE but takt to ${fmtDate(r.due)} is ${fmt(r.taktSec, 0)} s/pc. Run it on ${need} machines in parallel or move the due date.`, b: [['Open schedule', 'nav:schedule']] });
  });
  const late = model.rows.filter(r => r.qty > 0 && r.late && r.meetsTakt);
  if (late.length) items.push({ k: 'warn', t: `${late.length} operations finish after their due date`, p: `Mostly caused by machines loaded beyond the month. The Loading Schedule shows each start and finish date.`, b: [['Open schedule', 'nav:schedule']] });
  const issues = dataIssues();
  if (issues.length) items.push({ k: 'info', t: `${issues.length} master data check${issues.length > 1 ? 's' : ''} to review`, p: issues[0].text, b: [['Review data', 'masters:check']] });
  if (!items.length) return `<div class="act"><span class="stripe" style="background:var(--ok)"></span><div><h4>Plan is within capacity</h4><p>All machines have spare days and every operation finishes by its due date.</p></div></div>`;
  const col = { crit: 'var(--crit)', warn: 'var(--warn)', info: 'var(--brass)' };
  return items.slice(0, 7).map(i => `<div class="act"><span class="stripe" style="background:${col[i.k]}"></span><div><h4>${h(i.t)}</h4><p>${h(i.p)}</p><div class="go">${i.b.map(b => `<button class="btn sm" data-go="${h(b[1])}">${h(b[0])}${icon('arrow')}</button>`).join('')}</div></div></div>`).join('');
}

function drawLoadChart(sel) {
  const host = $(sel); if (!host) return;
  const W = Math.max(300, host.clientWidth || 640);
  const narrow = W < 520;
  const ms = model.machines;
  const labelW = narrow ? 104 : 140, valW = narrow ? 44 : 56, rowH = narrow ? 24 : 26, top = 22;
  const plotW = W - labelW - valW - 8;
  const sunOn = state.scenario === 'standard';
  const max = Math.ceil(Math.max(30, ...ms.map(m => Math.max(m.reqDays, m.availDays + (sunOn ? model.sundaysAvailable : 0)))) / 5) * 5;
  const x = v => labelW + (v / max) * plotW;
  const H = top + ms.length * rowH + 6;
  let g = '';
  for (let v = 0; v <= max; v += 5) g += `<line class="grid" x1="${x(v)}" x2="${x(v)}" y1="${top - 4}" y2="${H - 4}"/><text x="${x(v)}" y="12" text-anchor="middle">${v}${v === max ? ' d' : ''}</text>`;
  ms.forEach((m, i) => {
    const y = top + i * rowH, bh = rowH - 10;
    g += `<rect class="row-hit" data-go="mach:${h(m.code)}" x="0" y="${y}" width="${W}" height="${rowH}"><title>${h(m.code)}: ${fmt(m.reqDays)} of ${fmt(m.availDays, 1)} days</title></rect>`;
    g += `<text class="lab" x="${labelW - 8}" y="${y + rowH / 2 + 4}" text-anchor="end">${h(narrow ? m.code.replace('Engineering', 'Engg') : m.code)}</text>`;
    g += `<rect class="track" x="${x(0)}" y="${y + 5}" width="${plotW}" height="${bh}" rx="3"/>`;
    g += `<rect class="b-${m.tier}" x="${x(0)}" y="${y + 5}" width="${Math.max(0, x(Math.min(m.reqDays, max)) - x(0))}" height="${bh}" rx="3" pointer-events="none"/>`;
    g += `<line class="capline" x1="${x(m.availDays)}" x2="${x(m.availDays)}" y1="${y + 2}" y2="${y + rowH - 2}" pointer-events="none"/>`;
    if (sunOn) g += `<line class="sunline" x1="${x(m.availDays + model.sundaysAvailable)}" x2="${x(m.availDays + model.sundaysAvailable)}" y1="${y + 2}" y2="${y + rowH - 2}" pointer-events="none"/>`;
    g += `<text class="val" x="${W - 4}" y="${y + rowH / 2 + 4}" text-anchor="end">${fmt(m.reqDays, 1)}</text>`;
  });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Required days per machine compared with available days">${g}</svg>`;
}

/* ---------------------------------------------------------------- CAPACITY PLAN */
Pages.capacity = () => {
  const ms = model.machines.filter(m => ui.cellFilter === 'ALL' || m.cell === ui.cellFilter);
  const max = scaleMax();
  const tot = k => ms.reduce((a, m) => a + m[k], 0);
  const cells = [...new Set(model.machines.map(m => m.cell))];
  const sel = model.machines.find(m => m.code === ui.selMachine);
  const rows = ms.map(m => `<tr class="click ${m.code === ui.selMachine ? 'sel' : ''}" data-mach="${h(m.code)}">
      <td class="stick"><b>${h(m.code)}</b><div class="small muted">${h(m.cell)}</div></td>
      <td class="r"><input class="cell-inp" style="width:74px;text-align:right" type="number" step="0.5" min="0" id="av-${h(m.code)}" data-avail="${h(m.code)}" value="${m.baseDays}" aria-label="Available days for ${h(m.code)}">${state.scenario === 'sunday' ? `<div class="small muted">+${model.sundaysAvailable} Sun</div>` : ''}</td>
      <td class="r num"><b>${fmt(m.reqDays)}</b></td>
      <td class="r num ${m.balDays < 0 ? 'neg' : 'pos'}">${signed(m.balDays)}</td>
      <td style="min-width:110px">${loadBar(m, max)}</td>
      <td class="r num">${fmt(m.util, 1)}%</td>
      <td>${pill(m.tier)}<div class="small muted" style="margin-top:3px">Excel: ${m.excelStatus}</div></td>
      <td style="min-width:200px"><input class="cell-inp txt" id="rm-${h(m.code)}" data-remark="${h(m.code)}" value="${h(m.remarks)}" placeholder="Add remark…" aria-label="Remarks for ${h(m.code)}"></td>
    </tr>`).join('');
  const cards = ms.map(m => `<div class="mcard" data-mach="${h(m.code)}"><div class="t"><span>${h(m.code)}</span>${pill(m.tier)}</div>${loadBar(m, max)}
      <div class="s"><span>Available<b>${fmt(m.availDays, 1)}</b></span><span>Required<b>${fmt(m.reqDays)}</b></span><span>Balance<b style="color:${m.balDays < 0 ? 'var(--crit)' : 'var(--ok)'}">${signed(m.balDays)}</b></span></div>
      <div class="mrow"><label for="mav-m-${h(m.code)}">Available days</label><input class="cell-inp" style="max-width:90px;text-align:right" type="number" step="0.5" min="0" id="mav-m-${h(m.code)}" data-avail="${h(m.code)}" value="${m.baseDays}"><input class="cell-inp txt" id="mrm-m-${h(m.code)}" data-remark="${h(m.code)}" value="${h(m.remarks)}" placeholder="Remark…" aria-label="Remarks for ${h(m.code)}"></div></div>`).join('');
  return `
  <div class="grid-side">
    <section class="card"><div class="card-h"><div><h2>Machine-wise capacity</h2><div class="sub">${monthName()} · ${h(scenarioLabel())}. Available days and remarks can be edited here for this month.</div></div>
      <div class="seg" role="group" aria-label="Filter by cell"><button data-cell="ALL" class="${ui.cellFilter === 'ALL' ? 'on' : ''}">All</button>${cells.map(c => `<button data-cell="${h(c)}" class="${ui.cellFilter === c ? 'on' : ''} hide-sm">${h(c)}</button>`).join('')}</div></div>
      <div class="tbl-wrap desk-only" id="tw-cap"><table class="tbl"><thead><tr>
        <th class="stick">Machine<span class="xl">Excel A</span></th><th class="r">Available days<span class="xl">B</span></th><th class="r">Required days<span class="xl">C</span></th><th class="r">Balance days<span class="xl">D = B − C</span></th><th>Load</th><th class="r">Utilisation</th><th>Status<span class="xl">E</span></th><th>Remarks<span class="xl">F</span></th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td class="stick">Total · ${ms.length} machines</td><td class="r num">${fmt(tot('availDays'))}</td><td class="r num">${fmt(tot('reqDays'))}</td><td class="r num ${tot('balDays') < 0 ? 'neg' : 'pos'}">${signed(tot('balDays'))}</td><td></td><td class="r num">${fmt(tot('availDays') ? tot('reqDays') / tot('availDays') * 100 : 0, 1)}%</td><td colspan="2" class="small muted">Excel grand total check: ${fmt(model.totals.req)} days</td></tr></tfoot></table></div>
      <div class="mcards">${cards}</div>
    </section>
    <section class="card" id="inspector">${sel ? inspector(sel) : ''}</section>
  </div>`;
};

function inspector(m) {
  const ops = m.ops.slice().sort((a, b) => (b.qty > 0) - (a.qty > 0) || (a.start ?? 99) - (b.start ?? 99));
  return `<div class="card-h"><div><span class="eyebrow">Selected machine</span><h2>${h(m.code)}</h2></div>${pill(m.tier)}</div>
    <div class="card-b"><div class="insp-metrics"><div><span>Available</span><b>${fmt(m.availDays, 1)} d</b></div><div><span>Required</span><b>${fmt(m.reqDays)} d</b></div><div><span>Balance</span><b style="color:${m.balDays < 0 ? 'var(--crit)' : 'var(--ok)'}">${signed(m.balDays)}</b></div></div>
    <div class="oplist" id="ol-insp">${ops.map(r => `<div class="opcard ${r.qty ? '' : 'zero'}"><div class="l1"><span>${h(r.partNo)} · ${h(r.process)}</span><span class="num">${fmt(r.reqDays)} d</span></div>
      <div class="l2">${h(r.partName)}${r.moved ? ` · <span class="tag brass">from ${h(r.homeMachine)}</span>` : ''}${r.split && !r.moved ? ' · <span class="tag brass">split</span>' : ''}</div>
      <div class="l3"><span>${fmtInt(r.qty)} pcs</span><span>CT ${r.cycleTime}s</span><span>${fmt(r.pph, 1)} pcs/h</span>${r.qty ? `<span>Due ${fmtDate(r.due)}</span><span style="color:${r.late ? 'var(--crit)' : 'var(--ok)'}">${r.endDate ? 'Ends ' + fmtDate(r.endDate) : 'Beyond month'}</span>` : ''}</div></div>`).join('') || '<p class="muted">No operations routed to this machine.</p>'}</div>
    <div class="go" style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn sm" data-go="nav:schedule">Open schedule ${icon('arrow')}</button>${m.balDays < 0 ? `<button class="btn sm" data-go="nav:balance">Balance load ${icon('arrow')}</button>` : ''}</div></div>`;
}

/* ---------------------------------------------------------------- WORKOUT */
Pages.workout = () => {
  const q = (ui.search.work || '').toLowerCase();
  const machFilter = ui.workMachine || 'ALL';
  const s = state.settings;
  const rows = model.rows.filter(r => (!ui.hideZero || r.qty > 0) && (machFilter === 'ALL' || r.machine === machFilter) && (!q || `${r.partNo} ${r.partName} ${r.process} ${r.machine}`.toLowerCase().includes(q)));
  const sumK = k => rows.reduce((a, r) => a + r[k], 0);
  return `<section class="card"><div class="card-h"><div><h2>Operation-level workout</h2><div class="sub">PPH = (3600 ÷ cycle time) × ${s.oee}% OEE · Required hours = plan ÷ PPH · Required days = hours ÷ hours per day</div></div></div>
    <div class="toolbar">${searchBox('work', 'Search part, process or machine')}
      <select class="inp" style="width:auto" id="workMachine" aria-label="Machine filter"><option value="ALL">All machines</option>${model.machines.map(m => `<option ${m.code === machFilter ? 'selected' : ''}>${h(m.code)}</option>`).join('')}</select>
      <label class="chk"><input type="checkbox" id="hideZero" ${ui.hideZero ? 'checked' : ''}> Hide zero-quantity rows</label>
      <span class="grow"></span><span class="small muted">${rows.length} rows</span></div>
    <div class="tbl-wrap" id="tw-work"><table class="tbl"><thead><tr>
      <th class="stick">Part name<span class="xl">A</span></th><th>Part #<span class="xl">B</span></th><th>Process<span class="xl">C</span></th><th>Machine<span class="xl">D</span></th><th class="r">Month plan<span class="xl">E</span></th><th class="r">Cycle time (s)<span class="xl">F</span></th><th class="r">PPH @ ${s.oee}%<span class="xl">G</span></th><th class="r">Hrs / day<span class="xl">H</span></th><th class="r">Days / month<span class="xl">I</span></th><th class="r">Req. hours<span class="xl">J = E ÷ G</span></th><th class="r">Req. days<span class="xl">K = J ÷ H</span></th><th class="r">Balance days<span class="xl">L = I − K</span></th></tr></thead>
    <tbody>${rows.map(r => `<tr class="${r.qty ? '' : 'zero'}"><td class="stick">${h(r.partName)}</td><td class="mono">${h(r.partNo)}</td><td>${h(r.process)}</td><td>${h(r.machine)}${r.moved ? ' <span class="tag brass">moved</span>' : r.split ? ' <span class="tag brass">split</span>' : ''}</td>
      <td class="r num">${fmtInt(r.qty)}</td><td class="r num">${r.cycleTime}</td><td class="r num">${fmt(r.pph)}</td><td class="r num">${r.hoursPerDay}</td><td class="r num">${s.daysPerMonth}</td><td class="r num">${fmt(r.reqHours)}</td><td class="r num"><b>${fmt(r.reqDays)}</b></td><td class="r num ${r.rowBalance < 0 ? 'neg' : ''}">${fmt(r.rowBalance)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td class="stick">Total</td><td></td><td></td><td></td><td class="r num">${fmtInt(sumK('qty'))}</td><td></td><td></td><td></td><td></td><td class="r num">${fmt(sumK('reqHours'))}</td><td class="r num">${fmt(sumK('reqDays'))}</td><td></td></tr></tfoot></table></div>
    <div class="card-b" style="padding-top:12px">${note('', 'info', '“Balance days” (column L) treats each operation as if it had the machine to itself, exactly like the Excel sheet. The machine-level balance on the Capacity Plan is the figure to act on.')}</div></section>`;
};

/* ---------------------------------------------------------------- SCHEDULE */
Pages.schedule = () => {
  const mf = ui.schedMachine;
  const ms = model.machines.filter(m => mf === 'ALL' || m.code === mf);
  const cal = model.cal;
  const N = cal.n;
  const cols = `repeat(${N}, minmax(0,1fr))`;
  const wk = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  const today = new Date(); const tIso = E.iso(today.getFullYear(), today.getMonth(), today.getDate());
  // map schedulable unit -> calendar position (fractional day index 0..N)
  const sched = cal.schedulable;
  const pos = u => { if (u >= sched.length) return N; const i = Math.floor(u), f = u - i; return (sched[i].d - 1) + f; };
  const dayHead = cal.days.map(d => `<div class="g-day ${d.isHol ? 'hol' : d.isOff ? 'off' : ''}" title="${d.date}${d.isHol ? ' · Holiday' : d.isOff ? ' · Weekly off' : ''}"><span class="w">${wk[d.dow]}</span>${d.d}</div>`).join('');
  const bg = cal.days.map(d => `<i class="${d.isHol ? 'hol' : d.isOff && state.scenario !== 'sunday' ? 'off' : ''}"></i>`).join('');
  const lanes = ms.map(m => {
    const ops = m.ops.filter(r => r.qty > 0 && r.start != null);
    const bars = ops.map((r, i) => {
      const cls = r.overflow ? 'over' : r.late ? 'late' : (i % 2 ? 'b' : 'a');
      const dueD = Number(r.due.slice(8)); const dueL = (dueD - 0.5) / N * 100;
      const tip = `${h(r.partNo)} ${h(r.process)} · ${fmtInt(r.qty)} pcs · ${fmt(r.reqDays)} d · ${fmtDate(r.startDate)} → ${r.endDate ? fmtDate(r.endDate) : 'beyond month'} · due ${fmtDate(r.due)}${r.pieces.length > 1 ? ` · runs in ${r.pieces.length} blocks` : ''}`;
      return (r.pieces || [{ start: r.start, end: r.end }]).filter(pc => pc.start < sched.length).map(pc => {
        const l = pos(pc.start) / N * 100, rgt = pos(Math.min(pc.end, sched.length)) / N * 100;
        return `<div class="g-bar ${cls} ${r.moved ? 'moved' : ''}" style="left:${l.toFixed(2)}%;width:${Math.max(0.8, rgt - l).toFixed(2)}%" title="${tip}">${h(r.partNo)}</div>`;
      }).join('') + `<span class="g-due" style="left:${dueL.toFixed(2)}%" title="Due ${h(r.partNo)}: ${fmtDateLong(r.due)}"></span>`;
    }).join('');
    const capU = Math.min(m.availDays, sched.length);
    const capL = pos(capU) / N * 100;
    return `<div class="g-row"><div class="g-name"><b>${h(m.code)}</b><span style="color:${m.balDays < 0 ? 'var(--crit)' : 'var(--muted)'}">${fmt(m.reqDays, 1)} / ${fmt(m.availDays, 1)} d</span></div><div class="g-lane"><div class="g-bg" style="grid-template-columns:${cols}">${bg}</div>${bars}<span class="g-cap" style="left:${capL.toFixed(2)}%" title="Available days end"></span></div></div>`;
  }).join('');
  const tIdx = tIso.slice(0, 7) === model.key ? (Number(tIso.slice(8)) - 0.5) / N * 100 : null;

  const rows = [];
  ms.forEach(m => m.ops.filter(r => r.qty > 0).sort((a, b) => a.start - b.start).forEach(r => rows.push(r)));
  const status = r => r.overflow ? '<span class="pill critical">Beyond month</span>' : r.late ? '<span class="pill sunday">After due date</span>' : '<span class="pill ok">On time</span>';
  return `
  <section class="card"><div class="card-h"><div><h2>Loading timeline · ${monthName()}</h2><div class="sub">Operations run in due-date order on each machine. A 2nd operation cannot start before its 1st operation (transfer lag ${state.settings.transferLagHours} h). Hatched days are weekly offs.</div></div>
    <select class="inp" style="width:auto" id="schedMachine" aria-label="Machine"><option value="ALL">All machines</option>${model.machines.map(m => `<option ${m.code === mf ? 'selected' : ''}>${h(m.code)}</option>`).join('')}</select></div>
    <div class="toolbar legend"><span><i style="background:#2F4C7A"></i>Planned run</span><span><i class="fill-sunday"></i>Ends after due date</span><span><i class="fill-critical"></i>Runs beyond month</span><span><i style="background:var(--ink);transform:rotate(45deg);width:8px;height:8px"></i>Due date</span><span><i class="line"></i>End of available days</span><span><i style="outline:2px dashed var(--brass);background:transparent"></i>Moved by balancer</span></div>
    <div class="tbl-wrap" id="tw-gantt"><div class="gantt"><div class="g-head"><div class="g-name">Machine</div><div class="g-days" style="grid-template-columns:${cols}">${dayHead}</div></div>
      <div style="position:relative">${lanes}${tIdx != null ? `<span class="g-today" style="left:calc(170px + (100% - 170px) * ${(tIdx / 100).toFixed(4)})" title="Today"></span>` : ''}</div></div></div>
  </section>
  <section class="card"><div class="card-h"><div><h2>Operation schedule & takt check</h2><div class="sub">Takt time = working time available until the due date ÷ quantity on that machine. Effective cycle time = cycle time ÷ OEE.</div></div></div>
    <div class="tbl-wrap" id="tw-sched"><table class="tbl"><thead><tr><th class="stick">Machine</th><th>Part</th><th>Process</th><th class="r">Qty</th><th class="r">Due</th><th class="r">Cycle / effective (s)</th><th class="r">Takt (s)</th><th class="r">Run days</th><th class="r">Start</th><th class="r">Finish</th><th>Status</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td class="stick"><b>${h(r.machine)}</b></td><td><span class="mono">${h(r.partNo)}</span><div class="small muted">${h(r.partName)}</div></td><td>${h(r.process)}</td><td class="r num">${fmtInt(r.qty)}</td><td class="r num">${fmtDate(r.due)}</td>
      <td class="r num">${r.cycleTime} / ${fmt(r.effCT, 0)}</td><td class="r num ${r.meetsTakt ? 'pos' : 'neg'}">${fmt(r.taktSec, 0)}</td><td class="r num">${fmt(r.reqDays)}</td><td class="r num">${fmtDate(r.startDate)}</td><td class="r num">${r.endDate ? fmtDate(r.endDate) : '—'}</td><td>${status(r)}</td></tr>`).join('') || `<tr><td colspan="11" class="muted">No quantities entered for ${monthName()}.</td></tr>`}</tbody></table></div></section>`;
};

/* ---------------------------------------------------------------- BALANCER */
Pages.balance = () => {
  const s = state.settings;
  const base = E.compute(state, { scenario: 'standard' });
  const L = E.autoLevel(state);
  const after = E.compute(state, { scenario: 'standard', splitsOverride: L.splits });
  const applied = Object.keys(planOf().splits || {}).length;
  const overB = base.machines.filter(m => m.balDays < 0);
  const cmp = base.machines.map((m, i) => { const a = after.machines[i]; return `<tr><td class="stick"><b>${h(m.code)}</b></td><td class="r num">${fmt(m.availDays, 1)}</td><td class="r num ${m.balDays < 0 ? 'neg' : ''}">${fmt(m.reqDays)}</td><td>${pill(m.tier)}</td><td class="r num ${a.balDays < 0 ? 'neg' : ''}"><b>${fmt(a.reqDays)}</b></td><td>${pill(a.tier)}</td><td class="r num">${signed(a.reqDays - m.reqDays)}</td></tr>`; }).join('');
  const sundays = base.machines.filter(m => m.balDays < 0).map(m => `<tr><td class="stick"><b>${h(m.code)}</b></td><td class="r num">${fmt(-m.balDays)}</td><td class="r num">${fmtInt(m.overloadHours)}</td><td class="r num">${Math.ceil(-m.balDays - 1e-9)}</td><td>${-m.balDays <= base.sundaysAvailable ? `<span class="pill sunday">Sundays cover it</span>` : `<span class="pill critical">Short by ${fmt(-m.balDays - base.sundaysAvailable)} d</span>`}</td></tr>`).join('');
  return `
  ${applied ? note('ok', 'check', `<b>${applied} balancing change${applied > 1 ? 's are' : ' is'} applied to ${monthName()}.</b> They are part of the plan on every screen and in exports. <button class="btn sm" data-act="clearSplits" style="margin-left:8px">Undo applied moves</button>`) : ''}
  <div class="grid-2e">
    <section class="card"><div class="card-h"><div><h2>Option A · Work Sundays / overtime</h2><div class="sub">${base.sundaysAvailable} Sundays in ${monthName()}. Days needed beyond available capacity, per machine.</div></div></div>
      ${overB.length ? `<div class="tbl-wrap" id="tw-sun"><table class="tbl"><thead><tr><th class="stick">Machine</th><th class="r">Days short</th><th class="r">Hours short</th><th class="r">Sundays needed</th><th>Result</th></tr></thead><tbody>${sundays}</tbody></table></div>` : `<div class="card-b">${note('ok', 'check', 'No machine is over capacity in the standard plan.')}</div>`}
      <div class="card-b" style="padding-top:12px"><button class="btn" data-scn="sunday">Preview with Sundays</button></div></section>
    <section class="card"><div class="card-h"><div><h2>Option B · Auto-Level</h2><div class="sub">Moves or splits operations from overloaded machines to machines with spare days.</div></div></div>
      <div class="card-b"><div class="form-grid">
        <div class="field"><label for="lvTarget">Load machines up to (%)</label><input class="inp num" type="number" id="lvTarget" data-setting="levelTargetPct" value="${s.levelTargetPct}" min="50" max="130"><span class="hint">100% = exactly the available days</span></div>
        <div class="field"><label for="lvLot">Round moved quantity to</label><input class="inp num" type="number" id="lvLot" data-setting="lotSize" value="${s.lotSize}" min="1"><span class="hint">pieces (lot size)</span></div></div>

Pages.plan = () => {
  const plan = planOf();
  const q = (ui.search.plan || '').toLowerCase();
  const parts = new Map();
  state.operations.forEach(o => { if (!parts.has(o.partNo)) parts.set(o.partNo, { partNo: o.partNo, partName: o.partName, ops: [] }); parts.get(o.partNo).ops.push(o); });
  const rowsByOp = new Map(); model.rows.forEach(r => { const l = rowsByOp.get(r.opId) || []; l.push(r); rowsByOp.set(r.opId, l); });
  const first = E.iso(state.year, state.month, 1), last = model.monthEnd;
  const list = [...parts.values()].filter(p => !q || `${p.partNo} ${p.partName}`.toLowerCase().includes(q));
  const prevKey = E.periodKey(state.month === 0 ? state.year - 1 : state.year, (state.month + 11) % 12);
  const totQty = list.reduce((a, p) => a + ((plan.parts[p.partNo] || {}).qty || 0), 0);
  const body = list.map(p => {
    const pp = plan.parts[p.partNo] || {};
    const rs = p.ops.flatMap(o => rowsByOp.get(o.id) || []);
    const days = rs.reduce((a, r) => a + r.reqDays, 0);
    const late = rs.some(r => r.qty > 0 && r.late), takt = rs.some(r => r.qty > 0 && !r.meetsTakt);
    const st = !(pp.qty > 0) ? '<span class="pill idle">No quantity</span>' : takt ? '<span class="pill critical">Takt not met</span>' : late ? '<span class="pill sunday">Late</span>' : '<span class="pill ok">On time</span>';
    const id = safeName(p.partNo);
    return `<tr><td class="stick mono"><b>${h(p.partNo)}</b></td><td>${h(p.partName)}</td>
      <td class="r"><input class="cell-inp" style="width:110px;text-align:right" type="number" min="0" step="100" inputmode="numeric" id="qty-${id}" data-qty="${h(p.partNo)}" value="${pp.qty || 0}" aria-label="Quantity for ${h(p.partNo)}"></td>
      <td><input class="cell-inp" style="width:150px" type="date" min="${first}" max="${last}" id="due-${id}" data-due="${h(p.partNo)}" value="${h(pp.due || last)}" aria-label="Due date for ${h(p.partNo)}"></td>
      <td><div style="display:flex;flex-wrap:wrap;gap:4px">${p.ops.map(o => `<span class="tag" title="${h(o.process)} on ${h(o.machine)}, ${o.cycleTime}s">${h(o.process)} · ${h(o.machine)} · ${o.cycleTime}s</span>`).join('')}</div></td>
      <td class="r num">${fmt(days)}</td><td>${st}</td></tr>`;
  }).join('');
  const mcards = list.map(p => { const pp = plan.parts[p.partNo] || {}; const id = safeName(p.partNo); const rs = p.ops.flatMap(o => rowsByOp.get(o.id) || []);
    const late = rs.some(r => r.qty > 0 && r.late), takt = rs.some(r => r.qty > 0 && !r.meetsTakt);
    const st = !(pp.qty > 0) ? '<span class="pill idle">No quantity</span>' : takt ? '<span class="pill critical">Takt not met</span>' : late ? '<span class="pill sunday">Late</span>' : '<span class="pill ok">On time</span>';
    return `<div class="mcard"><div class="t"><span class="mono">${h(p.partNo)}</span>${st}</div><div class="small muted">${h(p.partName)} · ${p.ops.length} operation${p.ops.length > 1 ? 's' : ''}</div>
      <div class="mrow"><input class="cell-inp" style="text-align:right" type="number" min="0" step="100" inputmode="numeric" id="mqty-${id}" data-qty="${h(p.partNo)}" value="${pp.qty || 0}" aria-label="Quantity for ${h(p.partNo)}"><input class="cell-inp" type="date" min="${first}" max="${last}" id="mdue-${id}" data-due="${h(p.partNo)}" value="${h(pp.due || last)}" aria-label="Due date for ${h(p.partNo)}"></div></div>`; }).join('');
  return `
  ${!hasPlan() ? note('warn', 'info', `<b>${monthName()} has no plan yet.</b> Start from zero, or copy last month’s quantities and due dates. ${state.plans[prevKey] ? `<button class="btn sm" data-act="copyPrev" style="margin-left:8px">Copy from ${E.MONTHS[(state.month + 11) % 12]}</button>` : ''}`) : ''}
  <section class="card"><div class="card-h"><div><h2>Quantities & due dates · ${monthName()}</h2><div class="sub">The quantity applies to every operation of the part. Leave the due date at month end if the customer has none.</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="pastePlan">${icon('paste')}Paste from Excel</button><button class="btn" data-act="importXlsx">${icon('excel')}Import .xlsx</button>${state.plans[prevKey] && hasPlan() ? `<button class="btn" data-act="copyPrev">${icon('copy')}Copy last month</button>` : ''}<button class="btn danger" data-act="clearQty">Clear quantities</button></div></div>
    <div class="toolbar">${searchBox('plan', 'Search part number or name')}<span class="grow"></span><span class="small muted">${list.length} parts · <span class="num">${fmtInt(totQty)}</span> pcs</span></div>
    <div class="mcards">${mcards}</div>
    <div class="tbl-wrap desk-only" id="tw-plan"><table class="tbl"><thead><tr><th class="stick">Part #</th><th>Part name</th><th class="r">Monthly quantity</th><th>Customer due date</th><th>Routing (process · machine · cycle time)</th><th class="r">Machine days</th><th>Status</th></tr></thead><tbody>${body}</tbody></table></div>
    <div class="card-b" style="padding-top:12px"><button class="btn primary" data-nav="capacity">Review capacity ${icon('arrow')}</button></div>
  </section>`;
};

function dataIssues() {
  const out = [];
  const codes = new Set(state.machines.map(m => m.code));
  const names = new Map();
  state.operations.forEach(o => {
    if (!codes.has(o.machine)) out.push({ level: 'crit', text: `${o.partNo} ${o.process} is routed to “${o.machine}”, which is not in the machine list.` });
    if (!(o.cycleTime > 0)) out.push({ level: 'crit', text: `${o.partNo} ${o.process} has no cycle time.` });
    const n = names.get(o.partNo) || new Set(); n.add(o.partName); names.set(o.partNo, n);
  });
  names.forEach((set, pn) => { if (set.size > 1) out.push({ level: 'warn', text: `Part ${pn} has ${set.size} different names: ${[...set].join(' / ')}.` }); });
  const seen = new Set();
  state.operations.forEach(o => { const k = o.partNo + '|' + o.process.toLowerCase(); if (seen.has(k)) out.push({ level: 'warn', text: `${o.partNo} has “${o.process}” twice.` }); seen.add(k); });
  state.machines.forEach(m => { if (m.active !== false && !state.operations.some(o => o.machine === m.code)) out.push({ level: 'warn', text: `Machine ${m.code} has no routings.` }); });
  const dupM = state.machines.map(m => m.code).filter((c, i, a) => a.indexOf(c) !== i);
  dupM.forEach(c => out.push({ level: 'crit', text: `Machine code ${c} appears more than once.` }));
  return out;
}

  if (ui.users === undefined && !ui.usersLoading) setTimeout(loadUsers, 0);
  const list = ui.users || [];
  const me = (Cloud.session() || {}).email;
  const counts = list.reduce((a, u) => (a[u.role] = (a[u.role] || 0) + 1, a), {});
  const rows = list.map(u => `<tr><td class="stick"><b>${h(u.name || u.email.split('@')[0])}</b>${u.email === me ? ' <span class="tag">You</span>' : ''}<div class="small muted">${h(u.email)}</div></td>
      <td><select class="cell-inp txt" style="width:auto" id="role-${safeName(u.email)}" data-userrole="${h(u.email)}" ${u.email === me ? 'disabled title="You cannot change your own role"' : ''}>${['admin', 'editor', 'viewer'].map(r => `<option value="${r}" ${u.role === r ? 'selected' : ''}>${ROLE_INFO[r].label}</option>`).join('')}</select></td>
      <td>${u.hasLogin ? (u.lastSignIn ? h(timeAgo(u.lastSignIn)) : '<span class="muted">Never signed in</span>') : '<span class="pill sunday">No login</span>'}</td>
      <td class="small muted">${u.createdBy ? h(u.createdBy) : ''}</td>
      <td class="r" style="white-space:nowrap"><button class="btn sm" data-act="resetUserPw" data-email="${h(u.email)}">${u.hasLogin ? 'Reset password' : 'Create login'}</button> ${u.email === me ? '' : `<button class="btn sm ghost" data-act="removeUser" data-email="${h(u.email)}" aria-label="Remove ${h(u.email)}">${icon('trash')}</button>`}</td></tr>`).join('');
  return `
  <section class="card"><div class="card-h"><div><h2>People with access</h2><div class="sub">${list.length} user${list.length === 1 ? '' : 's'} · ${['admin', 'editor', 'viewer'].map(r => `${counts[r] || 0} ${ROLE_INFO[r].label.toLowerCase()}${(counts[r] || 0) === 1 ? '' : 's'}`).join(' · ')}</div></div>

};

/* ---------------------------------------------------------------- HELP */
Pages.help = () => `

Required hours = Month plan ÷ PPH                           ← Excel J
Required days  = Required hours ÷ Hours per day             ← Excel K
Machine required days = Σ Required days of its operations   ← Pivot / Excel C
Balance days  = Available days − Required days              ← Excel D
Status = Balance &gt; 0 → within capacity, else Overload      ← Excel E</span>

/* ==========================================================================
   ACTIONS — event delegation, imports / exports, boot
   ========================================================================== */
'use strict';

function ensurePlan() {
  const k = model.key;
  if (!state.plans[k]) state.plans[k] = { parts: {}, machines: {}, splits: {} };
  const p = state.plans[k]; p.parts = p.parts || {}; p.machines = p.machines || {}; p.splits = p.splits || {};
  return p;
}
function setPeriod(y, m) { state.year = y; state.month = m; commit(); }

/* ---------- click delegation ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-nav],[data-act],[data-scn],[data-cell],[data-mach],[data-go],[data-mtab],[data-theme-set],[data-weekoff]');
  if (!t) return;
  if (t.matches('input,select')) return;
  if (ev.target.closest('input,select,textarea') && !t.dataset.act) return;
  const d = t.dataset;
  if (d.nav) return go(d.nav);
  if (d.scn) { state.scenario = d.scn; commit(); toast(`Scenario: ${scenarioLabel()}`); return; }
  if (d.cell) { ui.cellFilter = ui.cellFilter === d.cell ? 'ALL' : d.cell; if (ui.page !== 'capacity') ui.page = 'capacity'; return render(); }
  if (d.mach) { ui.selMachine = d.mach; if (ui.page !== 'capacity') { ui.page = 'capacity'; render(); } else render(); const ins = $('#inspector'); if (ins && window.innerWidth < 1181) ins.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (d.go) {
    const [k, v] = d.go.split(':');
    if (k === 'nav') return go(v);
    if (k === 'mach') { ui.selMachine = d.go.slice(5); return go('capacity'); }
    if (k === 'masters') { ui.mastersTab = v; return go('masters'); }
  }
  if (d.mtab) { ui.mastersTab = d.mtab; return render(); }
  if (d.themeSet) { LS.set(K_THEME, d.themeSet); applyTheme(); return render(); }
  if (d.weekoff) {
    if (!can('admin')) return toast('Only an admin can change the calendar.');
    const i = Number(d.weekoff), w = new Set(state.settings.weeklyOff || []);
    w.has(i) ? w.delete(i) : w.add(i); state.settings.weeklyOff = [...w].sort(); return commit();
  }
  if (d.act && Actions[d.act]) {
    const need = actNeeds(d.act);
    if (need && !can(need)) return toast(need === 'admin' ? 'Only an admin can do this.' : 'You have view-only access.');
    Actions[d.act](t, ev);
  }
});

/* ---------- change / input delegation ---------- */
document.addEventListener('change', ev => {
  const el = ev.target, d = el.dataset;
  if (el.id === 'selMonth' || el.id === 'selYear') return setPeriod(Number($('#selYear').value), Number($('#selMonth').value));
  if (el.id === 'schedMachine') { ui.schedMachine = el.value; return render(); }
  if (el.id === 'workMachine') { ui.workMachine = el.value; return render(); }
  if (el.id === 'hideZero') { ui.hideZero = el.checked; return render(); }
  if (d.userrole) return setUserRole(d.userrole, el);
  const need = fieldNeeds(el);
  if (need && !can(need)) { toast('You do not have permission to change this.'); return render(); }
  if (d.qty) { const p = ensurePlan(); const pp = p.parts[d.qty] = p.parts[d.qty] || {}; pp.qty = Math.max(0, Number(el.value) || 0); if (!pp.due) pp.due = model.monthEnd; return commit(); }
  if (d.due) { const p = ensurePlan(); const pp = p.parts[d.due] = p.parts[d.due] || { qty: 0 }; pp.due = el.value || model.monthEnd; return commit(); }
  if (d.avail) { const p = ensurePlan(); const mm = p.machines[d.avail] = p.machines[d.avail] || {}; mm.availDays = el.value === '' ? null : Math.max(0, Number(el.value)); return commit(); }
  if (d.remark) { const p = ensurePlan(); const mm = p.machines[d.remark] = p.machines[d.remark] || {}; mm.remarks = el.value; return commit(); }
  if (d.setting) {
    const k = d.setting, numeric = el.type === 'number';
    let v = numeric ? Number(el.value) : el.value;
    const lim = { oee: [1, 100], hoursPerDay: [1, 24], daysPerMonth: [1, 31], warnPct: [50, 100], transferLagHours: [0, 48], lotSize: [1, 1e6], levelTargetPct: [50, 130] }[k];
    if (numeric) { if (isNaN(v)) return toast('Please enter a number.'); if (lim) v = Math.min(lim[1], Math.max(lim[0], v)); }
    state.settings[k] = v; return commit();
  }
  if (d.settingBool) { state.settings[d.settingBool] = el.checked; return commit(); }
  if (d.mfield) return editMachine(Number(d.i), d.mfield, el);
  if (d.ofield) return editOp(Number(d.id), d.ofield, el);
});
document.addEventListener('input', ev => {
  const d = ev.target.dataset;
  if (d.search) { ui.search[d.search] = ev.target.value; clearTimeout(window._st); window._st = setTimeout(() => render(true), 180); }
});

function editMachine(i, f, el) {
  const m = state.machines[i]; if (!m) return;
  if (f === 'code') {
    const nv = el.value.trim(); if (!nv) { toast('Machine code cannot be empty.'); return render(); }
    if (nv !== m.code && state.machines.some(x => x.code === nv)) { toast(`${nv} already exists.`); return render(); }
    const old = m.code; m.code = nv;
    state.operations.forEach(o => { if (o.machine === old) o.machine = nv; o.alternates = (o.alternates || []).map(a => a === old ? nv : a); });
    Object.values(state.plans).forEach(p => {
      if (p.machines && p.machines[old]) { p.machines[nv] = p.machines[old]; delete p.machines[old]; }
      Object.values(p.splits || {}).forEach(list => list.forEach(a => { if (a.machine === old) a.machine = nv; }));
    });
    toast(`Renamed ${old} to ${nv} everywhere`);
  } else if (f === 'active') m.active = el.checked;
  else if (f === 'cell') m.cell = el.value.trim() || E.cellOf(m.code);
  else m[f] = el.value === '' ? null : Math.max(0, Number(el.value));
  commit();
}
function editOp(id, f, el) {
  const o = state.operations.find(x => x.id === id); if (!o) return;
  if (f === 'cycleTime') { const v = Number(el.value); if (!(v > 0)) { toast('Cycle time must be greater than 0.'); return render(); } o.cycleTime = v; }
  else if (f === 'partNo') {
    const nv = el.value.trim(); if (!nv) return render();
    const old = o.partNo; o.partNo = nv;
    if (!state.operations.some(x => x.partNo === old)) Object.values(state.plans).forEach(p => { if (p.parts && p.parts[old]) { p.parts[nv] = p.parts[nv] || p.parts[old]; delete p.parts[old]; } });
  } else o[f] = el.value.trim();
  commit();
}

/* ---------- actions ---------- */
const Actions = {
  prevMonth() { const m = state.month === 0 ? 11 : state.month - 1; setPeriod(state.month === 0 ? state.year - 1 : state.year, m); },
  nextMonth() { const m = state.month === 11 ? 0 : state.month + 1; setPeriod(state.month === 11 ? state.year + 1 : state.year, m); },
  moreMenu() {
    const items = PAGES.filter(p => !['overview', 'plan', 'capacity', 'schedule'].includes(p.id));
    modal({ title: 'More', body: `<div style="display:flex;flex-direction:column;gap:6px">${items.map(p => `<button class="btn" style="justify-content:flex-start;height:44px" data-nav="${p.id}">${icon(p.id)}${h(p.label)}</button>`).join('')}</div>`, buttons: [], cancel: 'Close' });
  },
  exportMenu() {
    modal({
      title: `Export · ${E.MONTHS[state.month]} ${state.year}`,
      body: `<div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn" style="justify-content:flex-start;height:52px" data-act="exportXlsx">${icon('excel')}<span style="text-align:left"><b>Excel workbook (.xlsx)</b><br><span class="small muted">Capacity Plan and Capacity-workout with live formulas, plus the schedule</span></span></button>
        <button class="btn" style="justify-content:flex-start;height:52px" data-act="printReport">${icon('print')}<span style="text-align:left"><b>PDF report / print</b><br><span class="small muted">A4 landscape summary — choose “Save as PDF” in the print dialog</span></span></button>
        <button class="btn" style="justify-content:flex-start;height:52px" data-act="exportJson">${icon('download')}<span style="text-align:left"><b>Backup file (.json)</b><br><span class="small muted">Full data for another PC or for safekeeping</span></span></button></div>`,
      buttons: [], cancel: 'Close'
    });
  },
  exportXlsx() { closeModal(); exportWorkbook(); },
  printReport() { closeModal(); printReport(); },
  exportJson() {
    closeModal();
    const blob = new Blob([JSON.stringify(Object.assign({ app: 'Capacity Planner', exportedAt: new Date().toISOString() }, state), null, 1)], { type: 'application/json' });
    download(`${safeName(state.settings.companyName)}_Capacity_Backup_${state.year}-${E.pad(state.month + 1)}.json`, blob); toast('Backup downloaded');
  },
  importJson() {
    pickFile('.json,application/json', f => f.text().then(txt => {
      let d; try { d = JSON.parse(txt); } catch (e) { return toast('This file is not valid JSON.'); }
      const conv = d.version === 4 || d.plans ? normalise(d) : (d.operations && d.machines ? convertV3(d) : null);
      if (!conv) return toast('This file is not a Capacity Planner backup.');
      confirmBox('Restore backup?', `Replace current data with <b>${h(f.name)}</b> (${conv.machines.length} machines, ${conv.operations.length} operations, ${Object.keys(conv.plans).length} month plans)?`, 'Restore', () => { state = conv; commit(); toast('Backup restored'); });
    }));
  },
  importXlsx() { pickFile('.xlsx', importWorkbook); },
  resetAll() { confirmBox('Reset to sample data?', 'All machines, routings and monthly plans in this browser will be replaced with the September 2026 sample. Download a backup first if you need it.', 'Reset', () => { state = defaultState(); normalise(state); commit(); toast('Sample data restored'); }, true); },
  uploadLogo() {
    pickFile('image/*', f => {
      const r = new FileReader();
      r.onload = () => {
        const img = new Image();
        img.onload = () => { const sc = Math.min(1, 256 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); state.settings.logo = c.toDataURL('image/png'); commit(); toast('Logo updated'); };
        img.onerror = () => { state.settings.logo = r.result; commit(); };
        img.src = r.result;
      };
      r.readAsDataURL(f);
    });
  },
  removeLogo() { state.settings.logo = ''; commit(); },
  addHoliday() {
    const d = $('#hDate').value; if (!d) return toast('Choose a date first.');
    const s = state.settings; s.holidays = [...new Set([...(s.holidays || []), d])]; s.holidayNames = s.holidayNames || {};
    const n = $('#hName').value.trim(); if (n) s.holidayNames[d] = n; commit(); toast('Holiday added');
  },
  delHoliday(t) { const s = state.settings; s.holidays = (s.holidays || []).filter(x => x !== t.dataset.d); commit(); },
  copyPrev() {
    const py = state.month === 0 ? state.year - 1 : state.year, pm = (state.month + 11) % 12;
    const src = state.plans[E.periodKey(py, pm)]; if (!src) return toast('Last month has no plan.');
    const p = ensurePlan(), last = E.daysInMonth(state.year, state.month);
    Object.entries(src.parts || {}).forEach(([pn, v]) => { const day = v.due ? Math.min(last, Number(v.due.slice(8))) : last; p.parts[pn] = { qty: v.qty || 0, due: E.iso(state.year, state.month, day) }; });
    Object.entries(src.machines || {}).forEach(([mc, v]) => { p.machines[mc] = { availDays: v.availDays, remarks: '' }; });
    commit(); toast(`Copied ${E.MONTHS[pm]} quantities and due dates`);
  },
  clearQty() { confirmBox('Clear all quantities?', `Every quantity for ${E.MONTHS[state.month]} ${state.year} will be set to 0. Due dates are kept.`, 'Clear', () => { const p = ensurePlan(); Object.values(p.parts).forEach(x => x.qty = 0); commit(); }, true); },
  pastePlan() {
    modal({
      title: 'Paste quantities from Excel',
      body: `<p>Copy columns from Excel and paste below: <b>Part #</b>, <b>Quantity</b> and optionally <b>Due date</b> (e.g. 22-09-2026, 2026-09-22 or just 22).</p><textarea class="inp" id="pasteBox" placeholder="M-MI-045&#9;28000&#9;22-09-2026&#10;M-MI-042&#9;6000&#9;14"></textarea><div id="pasteInfo" class="small muted"></div>`,
      buttons: [{ label: 'Apply', cls: 'primary', act: () => {
        const res = parsePlanPaste($('#pasteBox').value);
        if (!res.rows.length) { $('#pasteInfo').textContent = 'No rows recognised. Check that the first column is the Part #.'; return true; }
        const p = ensurePlan(); res.rows.forEach(r => { const pp = p.parts[r.partNo] = p.parts[r.partNo] || {}; pp.qty = r.qty; if (r.due) pp.due = r.due; else if (!pp.due) pp.due = model.monthEnd; });
        commit(); toast(`Updated ${res.rows.length} parts${res.unknown.length ? ` · ${res.unknown.length} unknown part numbers skipped` : ''}`);
      } }]
    });
  },
  pasteRoutings() {
    modal({
      title: 'Paste routings from Excel',
      body: `<p>Paste rows copied from the Excel <b>Capacity-workout</b> sheet, columns A to F: Part name, Part #, Process, Machine code, Month plan, Cycle time. Five columns without Month plan also work.</p><textarea class="inp" id="pasteR"></textarea><label class="chk"><input type="checkbox" id="pasteReplace"> Replace all existing routings</label><div id="pasteRInfo" class="small muted"></div>`,
      buttons: [{ label: 'Import', cls: 'primary', act: () => {
        const lines = $('#pasteR').value.split(/\r?\n/).map(l => l.split('\t')).filter(c => c.length >= 5 && c[1] && c[1].trim());
        const rows = lines.map(c => ({ partName: c[0], partNo: c[1], process: c[2], machine: c[3], qty: c.length >= 6 ? Number(String(c[4]).replace(/,/g, '')) : null, ct: Number(String(c[c.length >= 6 ? 5 : 4]).replace(/,/g, '')) })).filter(r => r.ct > 0);
        if (!rows.length) { $('#pasteRInfo').textContent = 'No valid rows found. The cycle time must be a number.'; return true; }
        applyRoutingRows(rows, $('#pasteReplace').checked); toast(`Imported ${rows.length} operations`);
      } }]
    });
  },
  addMachine() {
    modal({
      title: 'Add machine', body: `<div class="form-grid"><div class="field"><label for="nmCode">Machine code</label><input class="inp" id="nmCode" placeholder="e.g. Elixir-5"></div><div class="field"><label for="nmCell">Cell / vendor</label><input class="inp" id="nmCell" placeholder="e.g. Elixir"></div></div>`,
      buttons: [{ label: 'Add machine', cls: 'primary', act: () => {
        const code = $('#nmCode').value.trim(); if (!code) { toast('Enter a machine code.'); return true; }
        if (state.machines.some(m => m.code === code)) { toast(`${code} already exists.`); return true; }

      } }]
    });
  },
  delMachine(t) {
    const m = state.machines[Number(t.dataset.i)]; const n = state.operations.filter(o => o.machine === m.code).length;
    if (n) return modal({ title: `Delete ${m.code}?`, body: `<p>${n} operation${n > 1 ? 's are' : ' is'} routed to ${h(m.code)}. Move them to:</p><select class="inp" id="reMach">${state.machines.filter(x => x.code !== m.code).map(x => `<option>${h(x.code)}</option>`).join('')}</select>`, buttons: [{ label: 'Move and delete', cls: 'danger', act: () => { const to = $('#reMach').value; state.operations.forEach(o => { if (o.machine === m.code) o.machine = to; o.alternates = (o.alternates || []).filter(a => a !== m.code); }); state.machines = state.machines.filter(x => x !== m); commit(); } }] });
    confirmBox(`Delete ${h(m.code)}?`, 'This machine has no routings.', 'Delete', () => { state.machines = state.machines.filter(x => x !== m); commit(); }, true);
  },
  addOp() {
    const parts = [...new Map(state.operations.map(o => [o.partNo, o.partName])).entries()];
    modal({

function parsePlanPaste(txt) {
  const known = new Set(state.operations.map(o => o.partNo));
  const rows = [], unknown = [];
  txt.split(/\r?\n/).forEach(line => {
    const c = line.split(/\t|;|,(?=\s*\d)/).map(x => x.trim()); if (c.length < 2 || !c[0]) return;
    const qty = Number(String(c[1]).replace(/[, ]/g, '')); if (isNaN(qty)) return;
    if (!known.has(c[0])) { unknown.push(c[0]); return; }
    rows.push({ partNo: c[0], qty: Math.max(0, qty), due: c[2] ? parseDue(c[2]) : null });
  });
  return { rows, unknown };
}
function parseDue(s) {
  s = String(s).trim(); const y = state.year, m = state.month, last = E.daysInMonth(y, m);
  let d;
  if (/^\d{1,2}$/.test(s)) d = Math.min(last, Number(s));
  else if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  else if ((d = /^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/.exec(s))) { const yy = d[3].length === 2 ? 2000 + Number(d[3]) : Number(d[3]); return E.iso(yy, Number(d[2]) - 1, Number(d[1])); }
  else if (/^\d{5}$/.test(s)) { const dt = new Date(Date.UTC(1899, 11, 30) + Number(s) * 864e5); return E.iso(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate()); }
  else return null;
  return E.iso(y, m, d);
}
function applyRoutingRows(rows, replace) {
  const clean = x => String(x || '').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
  if (replace) state.operations = [];
  let id = state.operations.reduce((a, o) => Math.max(a, o.id), 0);
  const p = ensurePlan();
  rows.forEach(r => {
    const mc = clean(r.machine);
    if (mc && !state.machines.some(m => m.code === mc)) state.machines.push({ code: mc, cell: E.cellOf(mc), availDays: null, hoursPerDay: null, remarks: '', active: true });
    const ex = state.operations.find(o => o.partNo === clean(r.partNo) && o.process === clean(r.process));
    if (ex) { ex.machine = mc; ex.cycleTime = r.ct; ex.partName = clean(r.partName) || ex.partName; }
    else state.operations.push({ id: ++id, partNo: clean(r.partNo), partName: clean(r.partName), process: clean(r.process), machine: mc, cycleTime: r.ct, alternates: [] });
    if (r.qty != null && !isNaN(r.qty)) { const pp = p.parts[clean(r.partNo)] = p.parts[clean(r.partNo)] || {}; pp.qty = r.qty; if (!pp.due) pp.due = model.monthEnd; }
  });
  commit();
}

function genPassword() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const a = new Uint32Array(10); crypto.getRandomValues(a);
  return Array.from(a, n => chars[n % chars.length]).join('').replace(/^(.{4})(.{3})/, '$1-$2-');
}

/* ---------- Excel import (reads the original capacity.xlsx layout) ---------- */
async function importWorkbook(file) {
  try {
    const sheets = await XLSX.read(await file.arrayBuffer());
    let work = null, hdr = -1, name = '';
    for (const [n, g] of Object.entries(sheets)) {
      for (let r = 0; r < Math.min(10, g.length); r++) {
        const row = (g[r] || []).map(v => String(v || '').toLowerCase().trim());
        if (row.includes('part name') && row.some(v => v.startsWith('machine')) && row.some(v => v.startsWith('cycle time'))) { work = g; hdr = r; name = n; break; }
      }
      if (work) break;
    }
    if (!work) return toast('No sheet with “Part Name”, “Machine Code” and “Cycle Time” headers was found.');
    const H = work[hdr].map(v => String(v || '').toLowerCase().trim());
    const col = f => H.findIndex(f);
    const cN = col(v => v === 'part name'), cP = col(v => v.startsWith('part #') || v === 'part no' || v === 'part number'), cPr = col(v => v.startsWith('process')),
      cM = col(v => v.startsWith('machine')), cQ = col(v => v.startsWith('month plan') || v === 'qty' || v === 'quantity'), cC = col(v => v.startsWith('cycle time')),
      cG = col(v => v.startsWith('pph')), cH = col(v => v.startsWith('working hours')), cI = col(v => v.startsWith('working days'));
    const rows = [];
    let oeeGuess = null, hrs = null, days = null;
    for (let r = hdr + 1; r < work.length; r++) {
      const w = work[r] || []; if (!w[cP] || !(Number(w[cC]) > 0)) continue;
      rows.push({ partName: w[cN], partNo: w[cP], process: w[cPr], machine: w[cM], qty: cQ >= 0 ? Number(w[cQ]) || 0 : null, ct: Number(w[cC]) });
      if (oeeGuess == null && cG >= 0 && Number(w[cG]) > 0) oeeGuess = Math.round(Number(w[cG]) * Number(w[cC]) / 36);
      if (hrs == null && cH >= 0 && Number(w[cH]) > 0) hrs = Number(w[cH]);
      if (days == null && cI >= 0 && Number(w[cI]) > 0) days = Number(w[cI]);
    }
    // Capacity Plan sheet: machines, available days, remarks
    const capRows = [];
    for (const g of Object.values(sheets)) {
      for (let r = 0; r < Math.min(10, g.length); r++) {
        const row = (g[r] || []).map(v => String(v || '').toLowerCase().trim());
        if (row[0] === 'machines' && row.some(v => v.includes('available'))) {
          const cA = row.findIndex(v => v.includes('available')), cR = row.findIndex(v => v.startsWith('remark'));
          for (let k = r + 1; k < g.length; k++) { const w = g[k] || []; if (w[0]) capRows.push({ code: String(w[0]).trim(), avail: Number(w[cA]), remark: cR >= 0 ? w[cR] || '' : '' }); }
        }
      }
    }
    modal({
      title: 'Import Excel workbook',
      body: `<p>Found <b>${rows.length}</b> operations on sheet “${h(name)}”${capRows.length ? ` and <b>${capRows.length}</b> machines on the Capacity Plan sheet` : ''}.</p>
        ${oeeGuess ? `<p>Detected plant standards: <b>OEE ${oeeGuess}%</b>${hrs ? `, <b>${hrs} h/day</b>` : ''}${days ? `, <b>${days} days/month</b>` : ''}.</p>` : ''}
        <p>Quantities and remarks will be loaded into <b>${E.MONTHS[state.month]} ${state.year}</b>. Change the month at the top first if needed.</p>
        <label class="chk"><input type="checkbox" id="impReplace" checked> Replace existing routings (recommended for the first import)</label>
        <label class="chk"><input type="checkbox" id="impStd" ${oeeGuess ? 'checked' : ''}> Use the detected plant standards</label>`,
      buttons: [{ label: 'Import', cls: 'primary', act: () => {
        if ($('#impStd').checked) { if (oeeGuess) state.settings.oee = oeeGuess; if (hrs) state.settings.hoursPerDay = hrs; if (days) state.settings.daysPerMonth = days; }
        applyRoutingRows(rows, $('#impReplace').checked);
        const p = ensurePlan();
        capRows.forEach(c => {
          if (!state.machines.some(m => m.code === c.code)) state.machines.push({ code: c.code, cell: E.cellOf(c.code), availDays: null, hoursPerDay: null, remarks: '', active: true });
          p.machines[c.code] = { availDays: isNaN(c.avail) ? null : c.avail, remarks: String(c.remark || '') };
        });
        commit(); toast(`Imported ${rows.length} operations from ${file.name}`);
      } }]
    });
  } catch (e) { toast(e.message || 'Could not read this workbook.'); }
}
