name: Fix Agentic AI loader
on:
  push:
    paths:
      - '.agentic-loader-fix-enable'
      - '.github/workflows/fix-agentic-loader.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Agentic loader unconditional
        shell: python
        run: |
          from pathlib import Path
          p = Path('kpi.js')
          s = p.read_text(encoding='utf-8')
          old = """  (function loadAgenticControlTower(){\n    function boot(){\n      if (!document.querySelector('[data-panel=\"agentic_ai\"]')) return;\n      import('/agentic-ai-v2/ui/control-tower.js').catch(function(e){ console.error('Agentic AI Control Tower failed to load:', e); });\n    }\n    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();\n  })();\n})();\n\n\n/* AGENTIC_AI_CONTROL_TOWER_LOADER */\n(function(){\n  function boot(){\n    if (!document.querySelector('[data-panel=\"agentic_ai\"]')) return;\n    import('/agentic-ai-v2/ui/control-tower.js').catch(function(e){\n      console.error('Agentic AI Control Tower failed to load:', e);\n    });\n  }\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);\n  else boot();\n})();"""
          new = """  (function loadAgenticControlTower(){\n    import('/agentic-ai-v2/ui/control-tower.js').catch(function(e){\n      console.error('Agentic AI Control Tower failed to load:', e);\n    });\n  })();\n})();"""
          if old not in s:
              raise SystemExit('Expected Agentic loader block not found; refusing unsafe edit.')
          p.write_text(s.replace(old, new), encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kpi.js
          git commit -m "Fix Agentic AI Control Tower loader timing"
          git push origin HEAD:main
